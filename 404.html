<!doctype html>
<html lang="de">
<head>

<title>Seite nicht gefunden | LED-Werbetafeln OWL</title>
<meta name="theme-color" content="#0a0f14">

<style>
:root{--ink:#0a0f14;--paper:#f4f1e9;--accent:#ffd400}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
main{width:min(780px,calc(100% - 40px));padding:70px 0}
.mark{width:38px;height:38px;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:42px}
.mark span{background:var(--accent)}
.kicker{font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase;color:#9ba4aa;margin-bottom:16px}
h1{font-size:clamp(52px,9vw,96px);line-height:.92;letter-spacing:-.055em;margin:0 0 24px}
p{color:#aeb7bc;font-size:18px;max-width:560px;margin:0 0 34px}
a{display:inline-flex;min-height:52px;align-items:center;justify-content:center;padding:14px 20px;background:var(--accent);color:#111;text-decoration:none;font-weight:850}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="kicker">Fehler 404</div>
